let paragraphs = [];

function processText() {
  paragraphs = DOCUMENT_TEXT
    .split(/\n+/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });
  document.getElementById("status").textContent =
    "题库已内置，共 " + paragraphs.length + " 段，可开始搜索";
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, function (m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m];
  });
}

function highlight(text, keywords) {
  let escaped = escapeHtml(text);
  keywords.forEach(function (kw) {
    if (!kw) return;
    const safeKw = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp("(" + safeKw + ")", "gi");
    escaped = escaped.replace(regex, "<mark>$1</mark>");
  });
  return escaped;
}

function search() {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) { alert("请输入关键词"); return; }
  if (!paragraphs.length) { alert("题库内容为空"); return; }

  const keywords = query.split(/\s+/).filter(Boolean);
  const results = [];

  paragraphs.forEach(function (p, idx) {
    const lowerP = p.toLowerCase();
    const allMatch = keywords.every(function (kw) {
      return lowerP.includes(kw.toLowerCase());
    });
    if (allMatch) results.push({ index: idx + 1, text: p });
  });

  renderResults(results, keywords);
}

function renderResults(results, keywords) {
  const resultsDiv = document.getElementById("results");

  if (results.length === 0) {
    resultsDiv.innerHTML = "<p>没有找到匹配内容。</p>";
    return;
  }

  let html = "<p>找到 " + results.length + " 处匹配：</p>";

  results.forEach(function (item) {
    let text = item.text;
    const firstKw = keywords[0];
    const pos = text.toLowerCase().indexOf(firstKw.toLowerCase());
    if (pos > 80) text = "..." + text.slice(pos - 80);
    if (text.length > 400) text = text.slice(0, 400) + "...";

    html +=
      '<div class="result-item">' +
        '<div class="result-meta">第 ' + item.index + ' 段</div>' +
        '<div class="result-text">' + highlight(text, keywords) + "</div>" +
      "</div>";
  });

  resultsDiv.innerHTML = html;
}

document.getElementById("searchBtn").addEventListener("click", search);
document.getElementById("searchInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") search();
});

processText();
</script>
