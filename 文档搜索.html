<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档关键词搜索</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px;
    color: #222;
    background: #f7f9fc;
  }
  h1 { text-align: center; color: #1a3d6d; }
  .upload-area {
    border: 2px dashed #7aa7d9;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    background: #fff;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .upload-area.dragover {
    background: #e8f2ff;
    border-color: #2d7dd2;
  }
  .upload-area input { margin-top: 10px; }
  .search-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  #searchInput {
    flex: 1;
    min-width: 200px;
    padding: 12px 14px;
    border: 1px solid #b9cde5;
    border-radius: 8px;
    font-size: 16px;
  }
  #searchBtn {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: #2d7dd2;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  #searchBtn:hover { background: #1f5fa8; }
  #status {
    width: 100%;
    color: #555;
    font-size: 14px;
    padding-top: 6px;
  }
  #results { margin-top: 10px; }
  .result-item {
    background: #fff;
    border-left: 4px solid #2d7dd2;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .result-meta {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }
  .result-text {
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  mark {
    background: #ffe066;
    color: #000;
    padding: 0 2px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<h1>文档关键词搜索</h1>

<div class="upload-area" id="uploadArea">
  <p>点击选择文件，或把文档拖到这里</p>
  <input type="file" id="fileInput" accept=".txt,.md,.docx">
  <p style="font-size:13px;color:#777;">支持 txt、md、docx</p>
</div>

<div class="search-area">
  <input type="text" id="searchInput" placeholder="输入关键词，多个关键词用空格分隔">
  <button id="searchBtn">搜索</button>
  <span id="status"></span>
</div>

<div id="results"></div>

<!-- 用于解析 docx -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<script>
let documentText = "";
let paragraphs = [];

const fileInput = document.getElementById("fileInput");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const resultsDiv = document.getElementById("results");
const statusSpan = document.getElementById("status");
const uploadArea = document.getElementById("uploadArea");

/* 文件选择 */
fileInput.addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (file) readFile(file);
});

/* 拖拽上传 */
uploadArea.addEventListener("dragover", function (e) {
  e.preventDefault();
  uploadArea.classList.add("dragover");
});
uploadArea.addEventListener("dragleave", function () {
  uploadArea.classList.remove("dragover");
});
uploadArea.addEventListener("drop", function (e) {
  e.preventDefault();
  uploadArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) readFile(file);
});

/* 读取文件 */
function readFile(file) {
  statusSpan.textContent = "正在读取...";
  const ext = file.name.split(".").pop().toLowerCase();

  if (ext === "docx") {
    const reader = new FileReader();
    reader.onload = function (event) {
      mammoth.extractRawText({ arrayBuffer: event.target.result })
        .then(function (result) {
          documentText = result.value;
          processText();
          statusSpan.textContent = "已加载：" + file.name + "，共 " + documentText.length + " 字符";
        })
        .catch(function (err) {
          statusSpan.textContent = "解析 docx 失败：" + err.message;
        });
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = function (event) {
      documentText = event.target.result;
      processText();
      statusSpan.textContent = "已加载：" + file.name + "，共 " + documentText.length + " 字符";
    };
    reader.readAsText(file, "UTF-8");
  }
}

/* 把文档切成段落 */
function processText() {
  paragraphs = documentText
    .split(/\n+/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });
}

/* 防止 HTML 注入 */
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, function (m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m];
  });
}

/* 关键词高亮 */
function highlight(text, keywords) {
  let escaped = escapeHtml(text);
  keywords.forEach(function (kw) {
    if (!kw) return;
    const safeKw = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp("(" + safeKw + ")", "gi");
    escaped = escaped.replace(regex, "<mark>$1</mark>");
  });
  return escaped;
}

/* 搜索 */
function search() {
  const query = searchInput.value.trim();
  if (!query) {
    alert("请输入关键词");
    return;
  }
  if (!paragraphs.length) {
    alert("请先上传文档");
    return;
  }

  const keywords = query.split(/\s+/).filter(Boolean);
  const results = [];

  paragraphs.forEach(function (p, idx) {
    const lowerP = p.toLowerCase();
    const allMatch = keywords.every(function (kw) {
      return lowerP.includes(kw.toLowerCase());
    });
    if (allMatch) {
      results.push({ index: idx + 1, text: p });
    }
  });

  renderResults(results, keywords);
}

/* 显示结果 */
function renderResults(results, keywords) {
  if (results.length === 0) {
    resultsDiv.innerHTML = "<p>没有找到匹配内容。</p>";
    return;
  }

  let html = "<p>找到 " + results.length + " 处匹配：</p>";

  results.forEach(function (item) {
    let text = item.text;

    // 如果段落太长，截取关键词附近内容
    const firstKw = keywords[0];
    const pos = text.toLowerCase().indexOf(firstKw.toLowerCase());
    if (pos > 80) {
      text = "..." + text.slice(pos - 80);
    }
    if (text.length > 400) {
      text = text.slice(0, 400) + "...";
    }

    html +=
      '<div class="result-item">' +
        '<div class="result-meta">第 ' + item.index + ' 段</div>' +
        '<div class="result-text">' + highlight(text, keywords) + "</div>" +
      "</div>";
  });

  resultsDiv.innerHTML = html;
}

/* 事件绑定 */
searchBtn.addEventListener("click", search);
searchInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") search();
});
</script>

</body>
</html>
